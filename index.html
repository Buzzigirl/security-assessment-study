<!doctype html>
<html lang="ko">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:#1B2A4A;--navy-light:#2C3E5E;--mint:#3ECFB2;--mint-dark:#168E79;
      --mint-light:#E6FAF7;--orange:#FF7043;--orange-light:#FFF0EB;--purple:#7C3AED;
      --purple-light:#EDE9FE;--red:#D92D20;--red-light:#FEECEB;--green:#168A63;
      --gray-bg:#F5F6F8;--gray-line:#DDE1E8;--gray-text:#667085;--text:#182230;
      --card:#FFFFFF;--white:#FFFFFF;--shadow:0 6px 24px rgba(27,42,74,.08);
    }
    [data-theme="dark"] {
      --gray-bg:#101522;--gray-line:#344054;--gray-text:#AAB2C0;--text:#F2F4F7;
      --card:#1C2433;--navy:#111827;--navy-light:#253149;--mint-light:#153D38;
      --orange-light:#47271F;--purple-light:#302451;--red-light:#48201F;--shadow:none;
    }
    *{box-sizing:border-box}
    html{background:var(--gray-bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif}
    body{margin:0;min-height:100vh;background:var(--gray-bg)}
    button,input,select,textarea{font:inherit}
    button{min-height:44px;cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(62,207,178,.38);outline-offset:2px}
    .topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:12px 16px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
    .topbar-inner{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}
    .brand{min-width:0;flex:1}.brand h1{font-size:18px;margin:0 0 2px}.brand p{font-size:12px;margin:0;color:#D7DDEA}
    .sync{display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}.sync-dot{width:9px;height:9px;border-radius:50%;background:#F59E0B}
    .sync.online .sync-dot{background:#22C55E}.sync.offline .sync-dot,.sync.error .sync-dot{background:#EF4444}
    .icon-btn{border:0;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;width:44px;padding:0;font-size:18px}
    main{max-width:1100px;margin:auto;padding:18px 14px 100px}
    .bottom-nav{position:fixed;z-index:30;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--gray-line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
    .nav-btn{border:0;background:transparent;color:var(--gray-text);font-size:11px;padding:5px 2px;min-height:52px;border-radius:10px}.nav-btn span{display:block;font-size:19px;line-height:21px}.nav-btn.active{color:var(--mint-dark);background:var(--mint-light);font-weight:700}
    h2{font-size:22px;margin:0 0 14px}h3{font-size:17px;margin:0 0 10px}p{line-height:1.65}
    .grid{display:grid;gap:12px}.grid.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.actions{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{background:var(--card);border:1px solid var(--gray-line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
    .stat strong{display:block;font-size:23px;color:var(--navy-light)}[data-theme="dark"] .stat strong{color:var(--mint)}.stat small{color:var(--gray-text)}
    .hero{background:linear-gradient(135deg,var(--navy),var(--navy-light));color:#fff;border:0}.hero h2{margin-bottom:6px}.hero p{margin:0;color:#D7DDEA}
    .progress{height:9px;background:rgba(138,148,166,.22);border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--mint);border-radius:inherit}
    .progress-label{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin:10px 0 6px}
    .btn{border:1px solid var(--gray-line);border-radius:13px;background:var(--card);color:var(--text);padding:10px 14px;font-weight:600}.btn.primary{border-color:var(--mint);background:var(--mint);color:#0A2B25}.btn.navy{border-color:var(--navy);background:var(--navy);color:#fff}.btn.danger{border-color:var(--red);background:var(--red);color:#fff}.btn.soft{background:var(--mint-light);border-color:transparent;color:var(--mint-dark)}.btn.block{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}
    .action{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:96px;text-align:left}.action b{font-size:16px}.action small{margin-top:5px;color:var(--gray-text)}
    .section-gap{margin-top:16px}.muted{color:var(--gray-text);font-size:13px}.notice{padding:12px 14px;border-radius:13px;background:var(--orange-light);color:var(--orange);font-size:13px}.notice.error{background:var(--red-light);color:var(--red)}
    .chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--gray-line);border-radius:999px;background:var(--card);padding:8px 12px;min-height:38px}.chip.active{background:var(--mint-light);border-color:var(--mint);color:var(--mint-dark);font-weight:700}
    .field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--gray-line);border-radius:12px;background:var(--card);color:var(--text);padding:12px;min-height:46px}.field textarea{min-height:92px;resize:vertical}
    .question-head{display:flex;align-items:flex-start;gap:10px}.question-head>div{flex:1}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;background:var(--purple-light);color:var(--purple);margin-right:5px}.badge.afccs{background:var(--orange-light);color:var(--orange)}
    .question-text{font-size:18px;font-weight:500;line-height:1.75;white-space:pre-wrap;margin:18px 0}.favorite{border:0;background:transparent;font-size:24px;color:#F59E0B;min-width:44px}
    .choices{display:grid;gap:10px}.choice{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;border:1px solid var(--gray-line);border-radius:15px;background:var(--card);color:var(--text);padding:13px;min-height:56px}.choice.selected{border-color:var(--mint);background:var(--mint-light)}.choice.correct{border-color:var(--green);background:var(--mint-light)}.choice.wrong{border-color:var(--red);background:var(--red-light)}.choice-index{display:grid;place-items:center;flex:0 0 29px;height:29px;border-radius:9px;background:var(--gray-bg);font-weight:700}.choice.selected .choice-index{background:var(--mint);color:#0A2B25}
    .diagram-wrap{display:grid;gap:6px;width:100%}.diagram{position:relative;width:150px;height:118px;margin:auto;border:2px solid currentColor;background:linear-gradient(142deg,transparent 49.3%,currentColor 49.6%,currentColor 50.4%,transparent 50.7%)}.diagram .tl{position:absolute;left:24px;top:26px}.diagram .br{position:absolute;right:26px;bottom:25px}.diagram-caption{text-align:center;font-size:12px;color:var(--gray-text)}
    .question-actions{position:sticky;bottom:70px;display:grid;grid-template-columns:1fr 1.5fr;gap:9px;margin-top:16px;padding:10px;background:color-mix(in srgb,var(--gray-bg) 90%,transparent);backdrop-filter:blur(8px);border-radius:16px}
    .feedback{margin-top:14px;padding:14px;border-radius:14px;font-weight:700}.feedback.ok{background:var(--mint-light);color:var(--green)}.feedback.no{background:var(--red-light);color:var(--red)}
    .list{display:grid;gap:10px}.list-item{background:var(--card);border:1px solid var(--gray-line);border-radius:14px;padding:14px}.list-item summary{cursor:pointer;font-weight:700}.answer-box{margin-top:10px;padding:12px;border-radius:11px;background:var(--mint-light);white-space:pre-wrap}.note-box{margin-top:8px;padding:12px;border-radius:11px;background:var(--purple-light);white-space:pre-wrap;font-size:13px}
    .result-score{text-align:center;padding:26px}.result-score strong{display:block;font-size:52px;color:var(--mint-dark)}.result-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--gray-line)}
    .empty{text-align:center;padding:35px 16px;color:var(--gray-text)}.toolbar{display:grid;gap:9px;margin-bottom:12px}.toolbar.two{grid-template-columns:1.3fr 1fr}
    .hidden{display:none!important}
    @media(min-width:701px){main{padding:26px 24px 110px}.grid.stats{grid-template-columns:repeat(4,1fr)}.grid.actions{grid-template-columns:repeat(4,1fr)}.content-two{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.bottom-nav{left:50%;right:auto;width:min(700px,100%);transform:translateX(-50%);border:1px solid var(--gray-line);border-bottom:0;border-radius:18px 18px 0 0}.toolbar{grid-template-columns:2fr 1fr 1fr}.question-text{font-size:20px}}
  </style>
</head>

    const BANK_META = {"sourceSha256":"202183825e19c529cab80717a3f6f8ee9a01635f7a9fdc934e31e4d934d346c5","counts":{"ox":85,"short":65,"mc":155},"total":305};
    const QUESTIONS = [{"type":"ox","afccs":false,"number":1,"sourceLine":7,"id":"ox-G-001","prompt":"각 군 총장 및 해병대사령관은 각 군별 임무·특성에 부합한 「보안예규」를 작성, 시행하여야 한다.","answer":"X","note":"10조 / 보안예규 → 보안규정"},{"type":"ox","afccs":false,"number":2,"sourceLine":11,"id":"ox-G-002","prompt":"군사비밀은 그 내용이 누설되는 경우 국가 안전보장 및 국가 이익에 현저한 위험을 초래될 것으로 명백히 인정되는 가치를 지닌 것을 Ⅲ급 비밀로 한다.","answer":"X","note":"16조 / Ⅱ급: 현저한 위험 (Tip: 치명적-Ⅰ급, 현저한-Ⅱ급, 상당한-Ⅲ급)"},{"type":"ox","afccs":false,"number":3,"sourceLine":15,"id":"ox-G-003","prompt":"장성급 장교 및 그와 동등한 직위자가 지휘하는 부대의 장은 자체 비밀 세부 분류기준을 정하여야 한다.","answer":"O","note":"19조 1항"},{"type":"ox","afccs":false,"number":4,"sourceLine":19,"id":"ox-G-004","prompt":"각 군 총장 및 해병대사령관은 각 군별 임무·특성에 부합한 「보안규정」을 작성, 시행하여야 한다.","answer":"O","note":"10조"},{"type":"ox","afccs":false,"number":5,"sourceLine":23,"id":"ox-G-005","prompt":"군사비밀은 그 내용이 누설되는 경우 국가 안전보장 및 국가 이익에 상당한 위험을 초래될 것으로 명백히 인정되는 가치를 지닌 것을 Ⅱ급 비밀로 한다.","answer":"X","note":"16조 / Ⅱ급: 상당한 위험"},{"type":"ox","afccs":false,"number":6,"sourceLine":27,"id":"ox-G-006","prompt":"정신보안이란 장병들의 보안의식 수준을 제고시켜 보안 사고를 예방하는 등 완벽한 군사보안태세 확립을 위한 제반 대책과 활동을 말한다.","answer":"O","note":"13조"},{"type":"ox","afccs":false,"number":7,"sourceLine":31,"id":"ox-G-007","prompt":"CD의 비밀표시는 전면 중앙에 군 전용 스티커를 부착하고, 그 밖의 비밀자료(필름, 사진, 영상자료 등)에는 비밀표시를 생략할 수 있다.","answer":"X","note":"24조 6항, 7항 / 그 밖의 비밀자료는 외견상 식별이 용이한 곳에 비밀표시를 함"},{"type":"ox","afccs":false,"number":8,"sourceLine":35,"id":"ox-G-008","prompt":"비밀의 취급은 해당 등급의 비밀 취급 인가를 받은 자로서 그 비밀과 업무상 직접 관련이 없어도 할 수 있다.","answer":"X","note":"17조 1항 / 비밀 취급은 업무상 직접 관련이 있어야 함"},{"type":"ox","afccs":false,"number":9,"sourceLine":39,"id":"ox-G-009","prompt":"업무참고용으로 비밀을 복제·복사하여 비밀바인더를 작성하는 경우에는 비밀지정권자의 승인을 받아 접수용 비밀관리기록부에 등재한다.","answer":"X","note":"34조 1항 / 비밀지정권자 → 보관책임관(정) 승인"},{"type":"ox","afccs":false,"number":10,"sourceLine":43,"id":"ox-G-010","prompt":"접수용 비밀관리기록부를 갱신할 필요가 있을 때에는 새로운 비밀관리기록부의 최종으로 기록된 난 밑에 갱신일자와 이기건수, 갱신기록자를 기재한 후 보관책임관 “정”이 확인 서명을 한다.","answer":"O","note":"31조"},{"type":"ox","afccs":false,"number":11,"sourceLine":47,"id":"ox-G-011","prompt":"접수용 비밀관리기록부를 갱신할 필요가 있을 때에는 기존 비밀관리기록부의 최종으로 기록된 난 밑에 갱신일자와 이기건수, 갱신기록자를 기재한 후 보관책임관 “정”이 확인 서명을 한다.","answer":"X","note":"31조 1항, 2항 / 기존 비밀관리기록부 → 새로운 비밀관리기록부"},{"type":"ox","afccs":false,"number":12,"sourceLine":51,"id":"ox-G-012","prompt":"접수한 사본을 재생산하여 배부 시 해당 비밀 원본 생산부대의 승인이 필요하나, 정기적으로 접수한 사본을 재생산·배부하는 경우는 예외로 할 수 있다.","answer":"O","note":"23조 1항 3호의 라"},{"type":"ox","afccs":false,"number":13,"sourceLine":55,"id":"ox-G-013","prompt":"Ⅰ급 비밀, 암호장비 및 암호논리는 복제·복사할 수 없으나, 보안자재의 경우 보관책임관 “정”의 승인하 복제·복사할 수 있다.","answer":"X","note":"33조 1항 / Ⅰ급 비밀, 암호장비·보안자재·암호논리는 복제·복사 불가"},{"type":"ox","afccs":false,"number":14,"sourceLine":59,"id":"ox-G-014","prompt":"비밀의 작성·분류·취급·유통 및 이관 등의 모든 과정에서 누설·유출되지 아니하도록 보안대책을 수립하여 시행해야 한다.","answer":"O","note":"39조 1항"},{"type":"ox","afccs":false,"number":15,"sourceLine":63,"id":"ox-G-015","prompt":"수정문을 접수한 부대에서는 기존 비밀에 수정내용을 기재 후 수정문은 파기 및 수정문 비밀이력카드에 관련 근거를 기재하여야 한다.","answer":"X","note":"46조 1항 1호, 2항 및 32조 1항 / 수정문 자체는 비밀이력카드를 첨부하지 않음"},{"type":"ox","afccs":false,"number":16,"sourceLine":67,"id":"ox-G-016","prompt":"예고문 변경 비밀은 시행문과 비밀이력카드에 예고문 변경 승인 근거를 포함하여 예고문 변경 내용을 기록해야 한다.","answer":"O","note":"51조 3항 3호"},{"type":"ox","afccs":false,"number":17,"sourceLine":71,"id":"ox-G-017","prompt":"보안담당관 및 보관책임관은 각급부대 보안규정(예규)에 직책을 명시하고, 별도의 인사명령 없이 보직과 동시에 임무를 수행한다.","answer":"X","note":"74조, 76조 / 보안담당관은 미해당 (보관책임관에 대한 내용)"},{"type":"ox","afccs":false,"number":18,"sourceLine":75,"id":"ox-G-018","prompt":"병사 면회객 중 외국 국적의 가족은 「부대관리 훈령」 면회규정을 적용한다.","answer":"O","note":"81조"},{"type":"ox","afccs":false,"number":19,"sourceLine":79,"id":"ox-G-019","prompt":"비밀은 최초 보관책임관 “정”이 결재한 때부터 비밀로 지정되며, 최종 결재권자의 결재 후 관리번호를 부여하여 접수용 비밀관리기록부에 등재하여 관리한다.","answer":"X","note":"25조 1항 / 보관책임관(정) → 비밀지정권자"},{"type":"ox","afccs":false,"number":20,"sourceLine":83,"id":"ox-G-020","prompt":"부대에 고용된 직원 및 영내 복지·편의시설에 근무하는 상주근무자는 신원조사 후 출입증을 발급해야 한다.","answer":"X","note":"94조 / 신원조사는 불필요함"},{"ty 3","prompt":"비밀의 대출은 당일 일과 시간 내로 함이 원칙이다.","answer":"O","note":"49조 5항"},{"type":"ox","afccs":false,"number":44,"sourceLine":179,"id":"ox-G-044","prompt":"사본의 보호기간은 원본의 보호기간보다 길게 부여할 수 없다.","answer":"O","note":"50조 1항"},{"type":"ox","afccs":false,"number":45,"sourceLine":183,"id":"ox-G-045","prompt":"비밀을 재분류 또는 예고문을 변경하였을 때에는 문서 또는 적자 표지의 구표시를 대각선 표시 및 여백에 재분류된 비밀등급 또는 변경된 예고문을 새로이 부여하며, 매면의 비밀등급도 일괄 변경해야 한다.","answer":"X","note":"51조 3항 4호의 다"},{"type":"ox","afccs":false,"number":46,"sourceLine":187,"id":"ox-G-046","prompt":"통제구역내 설치된 단말기는 각종 정보통신망이 연결되지 않았을 경우에는 하드디스크에 비밀자료를 보관할 수 있다.","answer":"O","note":"142조"},{"type":"ox","afccs":false,"number":47,"sourceLine":191,"id":"ox-G-047","prompt":"각급부대장은 군사통제구역·제한구역은 비인가 녹음 및 촬영방지를 위한 보안대책을 강구하여야 한다.","answer":"O","note":"90조"},{"type":"ox","afccs":false,"number":48,"sourceLine":195,"id":"ox-G-048","prompt":"군 휴대형 통신장비(휴대폰, TRS 무전기, 핸드토키, 위성전화기 등)를 작전통신망으로 운용 시에는 보안시스템을 사용하여야 하며, 적과 조우 및 교전시 등 긴급한 경우에는 평문으로 송신할 수 있으나 송신 후에는 지체 없이 지휘관에게 사유를 보고하고 해당 전문이나 일지에 기록하여야 한다.","answer":"O","note":"105조, 108조"},{"type":"ox","afccs":false,"number":49,"sourceLine":199,"id":"ox-G-049","prompt":"군사제한구역은 개인소유 상용정보통신장비 반입이 가능하지만 사진 촬영과 녹음은 불가하다.","answer":"O","note":"115조"},{"type":"ox","afccs":false,"number":50,"sourceLine":203,"id":"ox-G-050","prompt":"보안담당관 또는 분임보안담당관은 보관책임관 “정”을 겸직할 수 없다.","answer":"X","note":"76조 / 보관책임관 “정”을 겸직할 수 있다."},{"type":"ox","afccs":false,"number":51,"sourceLine":207,"id":"ox-G-051","prompt":"SNS를 사용시 군사비밀이 아니라면 업무목적으로 군 관련 사항(지시 사항등)을 소통할 수 있다.","answer":"X","note":"115조 / SNS 사용 군사비밀 및 군 관련 사항 소통 금지"},{"type":"ox","afccs":false,"number":52,"sourceLine":211,"id":"ox-G-052","prompt":"비밀의 보호기간을 ‘재발행시’로 기재할 수 있다.","answer":"X","note":"50조 2항 / 보호기간은 불확실하게 부여 금지"},{"type":"ox","afccs":false,"number":53,"sourceLine":215,"id":"ox-G-053","prompt":"인터넷 프린터는 외부망 접점을 차단하기 위해 단독으로 사용해야 한다.","answer":"O","note":"140조"},{"type":"ox","afccs":false,"number":54,"sourceLine":219,"id":"ox-G-054","prompt":"개인소유 정보통신장비의 GP "mc","afccs":false,"number":1,"sourceLine":494,"id":"mc-G-001","prompt":"비밀의 생산에 대한 내용 중 올바른 것은?","choices":["비밀을 생산할 때에는 가급적 보안대책을 강구하여야 한다.","비밀은 공무목적에 한정하여 그 부대 및 인접부대의 임무수행에 필요한 내용까지 생산할 수 있다.","비밀 생산 시 가제목 사용여부를 결정한다.","모든 비밀은 비밀발간 업체로 지정된 민간시설에서 발간할 수 있다."],"answers":[2],"note":"21조, 22조 / ① 가급적(X) ② 인접부대(X) ④ 모든(X)"},{"type":"mc","afccs":false,"number":2,"sourceLine":502,"id":"mc-G-002","prompt":"다음 중 비밀생산 시 보호대책으로 올바른 것은?","choices":["비밀 작업시 작업공간에 대한 표시","비밀생산과 관련이 없는 인원의 접근 통제","보관책임관 '정'이 결재하기 이전의 비밀 기안문서는 비밀과 동일하게 취급","Ⅱ급 비밀 생산은 별도 생산 장소를 설정, 무장 군사경찰을 배치"],"answers":[1],"note":"22조 / ① 작업 간 자리이탈시 비밀표지 부착 ③ 보관책임관(정)→비밀지정권자 ④ Ⅱ급→Ⅰ급"},{"type":"mc","afccs":false,"number":3,"sourceLine":510,"id":"mc-G-003","prompt":"다음 중 비밀이력카드에 기재할 사항으로 틀린 것은?","choices":["열람근거","비밀 대출 및 지출 근거","비밀 분리 및 합철 시 근거","비밀을 배부하기 위한 최초 비밀 복제·복사 근거"],"answers":[3],"note":"32조 ④항 / ④ 최초(X)"},{"type":"mc","afccs":false,"number":4,"sourceLine":518,"id":"mc-G-004","prompt":"다음 중 비밀의 인수인계 관련 틀린 것은?","choices":["비밀을 인수할 부대가 없거나 불명확한 때에는 원본은 차상급 부대에 인계하고 사본은 비밀보관책임관 \"정\"의 승인을 받아 파기한다.","부대가 해체되거나 개편 또는 교대될 때에는 차상급부대에 비밀을 인계한다.","수개의 부대로 분리하여 인계할 때에는 인수부대별로 인계 비밀 목록을 작성하여 인수자의 서명을 받아야 한다.","비밀을 인수한 부대는 인수일을 접수일로 하여 접수용 비밀관리기록부에 등재하고 관리번호를 부여한다."],"answers":[1],"note":"44조 / ② 차상급부대 → 업무를 인수받는 부대"},{"type":"mc","afccs":false,"number":5,"sourceLine":526,"id":"mc-G-005","prompt":"다음 중 비밀의 지출·대출·열람 관련 틀린 것은?","choices":["병사는 일절 지출 및 대출을 할 수 없다.","Ⅰ급 비밀은 지출할 수 없다.","Ⅱ·Ⅲ급 비밀을 열람할 경우 비밀이력카드에 기록해야 한다.","Ⅰ급 비밀은 보관책임관 \"정\"의 승인을 받아 대출할 수 있다."],"answers":[3],"note":"49조 / ④ 보관책임관(정) → 해당 부대장"},{"type":"mc","afccs":false,"number":6,"sourceLine":534,"id":"mc-G-006","prompt":"다음 중 예고문 부여 관련 틀린 것은?","choices":["비밀을 생산할 경우 원본에는 보호기간과 보존기간, 사본에는 보호 기간과 처리방법을 명시한다.","사본의 보호기간은 원본의 보호기간보다 길게 부여할 수 있다.","기한 예측이 어려울 때에는 생산일로부터 1년 이내로 부여하고, 영구보존이 필요한 때에는 \"영구\" 등으로 부여할 수 있다.","보존기간은 1년, 3년, 5년, 10년, 30년, 준영구, 영구 7종으로 부여해야 한다."],"answers":[1],"note":"50조 ①항 / ② 사본 보호기간은 원본보다 길게 부여할 수 없음"},{"type":"mc","afccs":false,"number":7,"sourceLine":542,"id":"mc-G-007","prompt":"다음 중 군사통제구역으로 틀린 곳은?","choices":["편제상 장성급 이상 지휘관이 지휘하는 부대의 지휘통제실","여단장급 이상 지휘관의 집무실","통합정보관리소","암호실"],"answers":[1],"note":"86조 3항"},{"type":"mc","afccs":false,"number":8,"sourceLine":550,"id":"mc-G-008","prompt":"비밀회의시 보안대책으로 틀린 것은?","choices":["여러 개의 안건으로 비밀회의를 개최 시는 안건 내용에 따라 업무와 관계있는 사람만 참석시켜야 한다.","군사보호구역으로 설정되지 않은 장소는 임시 보호구역(통제구역)으로 설정하여 이에 따른 보안대책을 강구하여야 한다.","회의 성격에 따라 부득이 비인가자의 참여가 필요할 때는 미리 서약서를 집행한 후 참석시켜야 한다.","비밀을 발표할 때에는 유·무선 마이크를 사용하여야 한다."],"answers":[3],"note":"204조 / ④ 무선 마이크 사용 금지"},{"type":"mc","afccs":false,"number":9,"sourceLine":558,"id":"mc-G-009","prompt":"다음 중 비밀취급 인가의 취소 사유로 올바른 것은?","choices":["경미한 과실로 보안위반을 범한 경우","1개월간 신체상 부상으로 직무를 담당할 수 없는 경우","보안벌점 누계가 3년 이내 5점인 자를 보안심사위원회에 회부한 경우","보안심사위원회에서 비밀취급 인가 취소를 결정한 경우"],"answers":[3],"note":"68조 / ① 경미한 → 고의 또는 중대한 ② 1개월간 신체상 부상 → 신체 또는 정신상 이상 ③ 5점 → 6점"},{"type":"mc","afccs":false,"number":10,"sourceLine":566,"id":"mc-G-010","prompt":"다음 중 비밀회의자료 생산·관리와 관련 틀린 것은?","choices":["회의 참석자에게 배부하기 위한 비밀회의 자료는 사본번호를 부여하여야 하며, 회의종료와 동시에 회수하여 파기할 자료는 접수용 비밀관리기록부에 등재된 원본의 비밀이력카드에 사본부수(사본번호) 및 파기근거를 기록하여야 한다.","종합하는 부서에 비밀 회의자료를 작업 중(초안)인 상태에서 제출할 때에는 비밀이력카드 및 발송용 비밀관리기록부에 근거를 기록하여야 한다.","종합하는 부서에 비밀 회의자료를 제출할 때에는 사본을 생산하여 제출하여야 한다.","종합하는 부서에 제출한 비밀 회의자료(초안)는 제공 후 문서 또는 파일을 파기하거나 소거하여야 한다."],"answers":[1],"note":"205조 / ② 비밀이력카드(X)"},{"type":"mc","afccs":false,"number":11,"sourceLine":574,"id":"mc-G-011","prompt":"다음 중 내국인 출입 관련 틀린 것은?","choices":["군 주둔지내에 소재하고 있는 역사 유적지 및 문화재를 대국민 홍보 목적 등으로 상시 또는 일정 기간 개방할 경우에는 각군 총장 또는 국직부대장의 승인을 받아야 한다.","내국인 초청, 견학, 위문방문, 행정 및 학술조사, 자연보호행사, 통신시설 점검 및 전파측정 활동 등의 목적으로 출입하는 인원은 대령급 부대장의 승인을 받아야 한다.","항공기, 헬기, 선박 등을 이용하여 부대를 출입할 경우에는 장성급 부대장의 승인을 받아야 한다.","주둔지역 주민들과의 친목 도모를 위한 부대 출입은 영관급 부대장 또는 이와 동등한 직위자가 시행할 수 있다."],"answers":[1],"note":"95조 / ② 대령급 부대장 → 장성급 부대장"},{"type":"mc","afccs":false,"number":12,"sourceLine":582,"id":"mc-G-012","prompt":"다음 중 군사시설의 일반지도(전자지도)상 표기 관련 틀린 것은?","choices":["군사시설이 일반인 다수가 공용으로 사용하는 복지 및 편의시설인 경우 대략적인 위치 또는 일반 도형으로 명칭과 함께 표기할 수 있다.","각군 사관학교 / 대학, 국방대학교, 학군교, 부사관학교, 육군훈련소 입소대대, 예비군 훈련장은 표기가 가능하다.","합동참모대학, 병과학교 등 군 전용교육시설은 표기를 금지한다.","인터넷상 홈페이지를 활용하여 \"찾아오는 길\"을 표기할 경우 사전 대령급 부대장의 보안성 검토를 받아야 한다."],"answers":[3],"note":"국방공간정보업무훈령 8조 / ④ 대령급부대장 → 장성급 부대장"},{"type":"mc","afccs":false,"number":13,"sourceLine":590,"id":"mc-G-013","prompt":"다음 훈령 내용 중 설명이 올바른 것은?","choices":["각급부대의 장은 소속 인원을 대상으로 보안사고(위반) 유무 및 신고 여부 등을 평가하되 근무평정표에만 반영하여야 한다.","대대급 이상의 부대검열 및 평가(전비태세, 전술훈련 등) 시에 보안 평가를 실시하고 총점의 3% 이상을 반영하여야 한다.","방위력개선사업관련 비밀의 제공 또는 설명에 관한 사항은 국방보안 심사위원회의 심의사항에 해당된다.","누설된 군사자료의 비밀여부 및 보안 영향성 판단에 관한 사항은 부대 보안심사위원회 심의사항에 해당된다."],"answers":[3],"note":"12조의 2 / ① 근평, 성과금심의 및 각종 포상 ② 5% ③ 부대보안심사위원회"},{"type":"mc","afccs":false,"number":14,"sourceLine":598,"id":"mc-G-014","prompt":"다음 중 '나'급 군사보안시설 및 보호장비 대상 보안순찰 주기는?","choices":["격주 1회 이상","월 1회 이상","분기 1회 이상","반기 1회 이상"],"answers":[2],"note":"93조 / Tip: 가월, 나분, 다반"},{"type":"mc","afccs":false,"number":15,"sourceLine":606,"id":"mc-G-015","prompt":"다음 중 비밀공사 대상으로 틀린 것은?","choices":["지원센터 및 정비시설","해군 전대급 함정의 탄약고","GP 시설","군사령부급 이상 작전지휘시설"],"answers":[1],"note":"별표 8 / ② 해군 함대사급 함정의 탄약고"},{"type":"mc","afccs":false,"number":16,"sourceLine":614,"id":"mc-G-016","prompt":"군사비밀이 포함되지 않은 군사자료를 무엇이라 하는가?","choices":["군사기밀","일반 군사자료","작전보안","군 관련 정보"],"answers":[1],"note":"별표 1"},{"type":"mc","afccs":false,"number":17,"sourceLine":622,"id":"mc-G-017","prompt":"다음 훈령 내용 중 올바른 것은?","choices":["보안담당관은 비밀 결재 시 전시 임무수행 필요 여부를 결정한다.","합동참모의장은 국방암호장비의 연구개발, 획득 및 운용·관리업무 등을 조정·통제한다.","각군 총장은 각급부대 및 방위사업청의 효율적인 군사·방위산업 보안업무 수행에 필요한 지원 업무를 수행한다.","전역·퇴직 등의 사유로 비밀취급 인가가 해제될 시 직무수행과 관련된 군사비밀에 대해서 누설하여서는 아니 된다."],"answers":[3],"note":"9조 / ① 비밀지정권자 ② 국방정보본부장 ③ 국군방첩사령관"},{"type":"mc","afccs":false,"number":18,"sourceLine":630,"id":"mc-G-018","prompt":"다음 훈령 내용 중 틀린 것은?","choices":["비밀회의 시 군사보호구역으로 설정되지 않은 장소는 임시 보호구역(통제구역)으로 설정하여 이에 따른 보안대책을 강구하여야 한다.","각급부대장이 공무 외 목적의 자료 대외 제공은 차상급 부대장의 보안성 검토를 별도로 받아야 한다.","업무상 비공개 업무자료를 부대에서 영외로 반출할 때는 소속부서 보안담당관의 승인을 받아야 한다.","용역업체·공사 인원 등이 업무목적상 출입 시에는 육안식별이 가능하도록 보안대책을 강구해야 한다."],"answers":[2],"note":"200조의 2 / ③ 보안담당관 → 보관책임관(정)"},{"type":"mc","afccs":false,"number":19,"sourceLine":638,"id":"mc-G-019","prompt":"정보통신망 및 정보시스템에 대한 보안측정 의뢰 시 보안측정 기관의 장에게 제출해야 할 요청서에 포함되어야 할 항목으로 틀린 것은?","choices":["보안측정 대상 체계(사업) 개요","보안측정 대상 체계명","개발 및 운용시험평가 자료","네트워크 구성도(정보보호시스템이 일부 포함된 구성도)"],"answers":[3],"note":"183조 ①항"},{"type":"mc","afccs":false,"number":20,"sourceLine":646,"id":"mc-G-020","prompt":"각급부대(업체) 보안측정 대상으로 틀린 것은?","choices":["새로운 진지로 이전하는 부대","군사보호구역","창설부대","군사보안시설 및 보호장비"],"answers":[1],"note":"182조 ①항"},{"type":"mc","afccs":false,"number":21,"sourceLine":654,"id":"mc-G-021","prompt":"다음 중 비밀관계 서류의 보존기간으로 틀린 것은?","choices":["비밀관리기록부 : 관리기록부 이기 후 5년","비밀이력카드월(비밀열람기록전) : 보호기간 만료 후 5년","재분류 및 예고문 변경철 : 연 단위 종합 후 다음해부터 5년","통제구역출입대장 : 연 단위 종합 후 다음 해부터 5년"],"answers":[3],"note":"219조 / ④ 통제구역출입대장 : 2년"},{"type":"mc","afccs":false,"number":22,"sourceLine":662,"id":"mc-G-022","prompt":"내·외부망 및 주컴퓨터(서버) 등 정보보호시스템 운용 시 필요한 대책에 대해 틀린 것은?","choices":["정보보호시스템의 로그는 일시, 내·외부 IP, 패킷사이즈를 포함하되, URL주소를 포함하여 저장하여야 한다.","해킹, 바이러스 감염 등 각종 위험을 탐지·차단·방지할 수 있도록 주요지점에 인가된 보호시스템을 설치·운용하는 등 보안대책을 강구하여야 한다.","침해사고 대응반은 정보보호시스템을 통해 탐지된 정보를 불시에 모니터링 및 점검하여야 한다.","하나의 정보보호시스템에 여러 가지 보호기능(방화벽 등)이 같이 탐재되어 있더라도 인가된 기능이 아니라면 별도 구축하여야 한다."],"answers":[2],"note":"148조 / ③ 불시에 → 주기적으로"},{"type":"mc","afccs":false,"number":23,"sourceLine":670,"id":"mc-G-023","prompt":"대도청 측정에 관한 사항 중 틀린 것은?","choices":["대도청 측정을 요청할 경우에는 목적, 희망 일자, 대상시설, 기타 참고사항을 포함하여 시행 15일전까지 지원 방첩부대장에게 요청하여야 한다.","장성급 장교 및 이와 동등한 직위자가 지휘하는 각급부대의 장은 보유시설에 대하여 도청에 따른 정보유출을 방지하기 위해 지원 방첩부대장 에게 요청하여야 한다.","국군방첩사령관은 필요시 해당 부대장의 동의 없이 대도청 측정을 실시할 수 있으며, 측정결과를 해당 부대의 장에게 통보하여 후속 조치를 요구할 수 있다.","대도청 측정은 비공개로 실시하여야 하며, 계획과 결과 등 관련 내용은 외부에 공개할 수 없다."],"answers":[2],"note":"104조 / ③ 대도청 측정은 사전 해당 부대장의 동의를 받아야 함"},{"type":"mc","afccs":false,"number":24,"sourceLine":678,"id":"mc-G-024","prompt":"보안측정 결과 조치로 틀린 것은?","choices":["보안측정 기관의 장은 보안측정을 실시 후 그 결과를 25일 이내에 해당 부대에 통보한다.","보안측정 결과를 통보받은 각급부대의 장은 필요한 대책을 수립, 시행하고 그 결과를 20일 이내 보안측정 기관의 장에게 통보하여야 한다.","'재측정 필요' 통보를 받은 각급부대의 장은 필요한 대책을 수립 및 시행하고 30일 이내에 재측정을 요청해야 한다.","제100조 제2항에 따른 보안대책 검토 대상인 정보체계는 보안측정 또는 재측정에 대한 후속조치 없이 운용할 수 없다."],"answers":[0],"note":"184조 / ① 25일 → 20일"},{"type":"mc","afccs":false,"number":25,"sourceLine":686,"id":"mc-G-025","prompt":"정보통신 시설 및 장비, 정보통신제원 보호 관련 사항으로 올바른 것은?","choices":["군 정보통신장비를 대외기관 및 외국에 대여 및 설치하거나 비군사 목적으로 사용할때에는 국가정보원장에게 보고하여 승인을 받아야한다.","통신전자운용지시(CEOI)를 생산하는 부대의 장은 지원 방첩부대장이 요청할 경우 전체 생산문서 1부를 제출하여야 한다.","군 정보통신장비를 북한으로 대여 및 설치하거나 비군사 목적으로 활용하는 것은 제한된다.","정보통신제원 및 피아 식별부호 등을 정보통신망으로 전송할 때에는 미리 군단장급 이상 부대장의 승인을 받은 후 인가된 보안시스템을 사용하여 송신하여야 한다."],"answers":[1],"note":"103조 / ① 국가정보원장 → 국방부장관 ③ 활용할 수 있음 ④ 군단장급 → 영관급 이상 부대장의 승인"},{"type":"mc","afccs":false,"number":26,"sourceLine":694,"id":"mc-G-026","prompt":"다음 중 개인소유 정보통신장비 통제에 관한 설명 중 틀린 것은?","choices":["개인소유의 정보통신장비 저장, 촬영, 전송 기능이 있는 장비를 영내에 반입할 경우에는 보안서약서를 제출해야 한다.","개인소유의 정보통신장비는 군사통제구역에 반입할 수 없다.","외국인이 개인소유 휴대전화를 영내에 반입할 경우 '휴대전화 보안통제체계'의 적용을 받지 않는다.","병은 개인소유 상용정보통신장비를 영내에 반입할 경우 등록 필증을 부착하여야 한다."],"answers":[2],"note":"115조 / ③ 외국인도 적용을 받음"},{"type":"mc","afccs":false,"number":27,"sourceLine":702,"id":"mc-G-027","prompt":"정보시스템 저장매체에 저장된 자료를 삭제할 경우로 틀린 것은?","choices":["정보시스템을 새롭게 도입하였을 경우","정보시스템 무상 보증기간 중 저장매체 또는 저장매체를 포함한 정보 시스템을 교체할 경우","고장수리를 위한 외부 반출 등 해당 부대가 정보시스템 저장매체를 보안 통제할 수 없는 환경으로 이동이 필요한 경우","그 밖에 저장자료 삭제가 필요하다고 판단되는 경우"],"answers":[0],"note":"별표 18 정보시스템 저장매체 불용처리 3조"},{"type":"mc","afccs":false,"number":28,"sourceLine":710,"id":"mc-G-028","prompt":"다음 중 상용정보통신 시설 및 장비 보안관리 중 틀린 것은?","choices":["상용정보통신 시설 및 촬영·저장 등의 기능이 있는 장비를 군 영내에 설치하거나 군사적으로 사용할 때는 대령급 부대장 승인이 있어야 한다.","상용정보통신망에서 군사비밀, 비공개 업무자료, 군사보안상 유용한 내용은 저장 및 통신할 수 없다.","자료저장 장치가 내장되어 있는 디지털복합기는 보안적합성 검증을 받은 제품으로 도입한다.","업무용 휴대전화(재난안전폰, AMOS폰 등)를 통제구역에서 사용할 때에는 장성급 부대장 승인하에 보안대책을 강구하여야 한다."],"answers":[0],"note":"112조 / ① 대령급 부대장 → 장성급 부대장"},{"type":"mc","afccs":false,"number":29,"sourceLine":718,"id":"mc-G-029","prompt":"정보통신망을 이용한 비밀·비공개 업무자료 송신에 관한 사항으로 올바른 것은?","choices":["Ⅰ급 비밀은 정보통신망으로 송신할 수 없으나, 부득이한 경우에는 소속 부대 보안담당관의 승인을 받아 암호자재로 암호화하여 송신할 수 있다.","Ⅱ급 비밀은 암호장비·암호/음어자재로 암호화하여 송신할 수 있다.","비공개 업무자료는 군전용 암호모듈, 군 암호소프트웨어 및 군 보안 적합성 검증을 받은 검증필암호모듈로 암호화하여 송신할 수 있다.","긴급한 경우에도 비밀에 관한 사항은 평문으로 송신할 수 없다."],"answers":[2],"note":"105조 / ① Ⅰ급 비밀취급인가권자의 승인 ② 음어자재(X) ④ 평문 송신 가능"},{"type":"mc","afccs":false,"number":30,"sourceLine":726,"id":"mc-G-030","prompt":"비밀 분실 후 미신고 및 미회수시 훈령(별표 5)상 처리기준은?","choices":["사법처리","중징계","경징계","경고"],"answers":[1],"note":"별표 5 보안사고(위반)자 처리기준"},{"type":"mc","afccs":false,"number":31,"sourceLine":734,"id":"mc-G-031","prompt":"비밀이력카드를 분리하여 관리하는 경우로 틀린 것은?","choices":["비밀의 지출","비밀의 이관","비밀의 존안","비밀의 파기"],"answers":[2],"note":"32조 / ③ 존안 비밀은 비밀이력카드와 함께 보관함"},{"type":"mc","afccs":false,"number":32,"sourceLine":742,"id":"mc-G-032","prompt":"다음 비밀의 분류원칙으로 올바른 것은?","choices":["비밀은 적절히 보호할 수 있는 최고 등급으로 분류하여야 한다.","암호자재 및 암호장비는 Ⅱ급 비밀로 분류한다.","음어자재는 Ⅱ급 비밀로 분류한다.","비밀은 제대별로 내용과 가치의 정도에 따라 차등 분류하여야 한다."],"answers":[3],"note":"18조 / ① 최저 ② Ⅱ급 ③ Ⅲ급"},{"type":"mc","afccs":false,"number":33,"sourceLine":750,"id":"mc-G-033","prompt":"보안자재 취급책임관(정·부) 임무로 틀린 것은?","choices":["자재 소유현황조사 및 보고","화재, 도난, 분실 및 피탈 등으로부터 보호·관리","자재 수발 및 보관용기 열쇠 관리","비밀합동보관소 출입자 기록 유지"],"answers":[3],"note":"별표 24 직책별 주요 보안업무 간 수행임무"},{"type":"mc","afccs":false,"number":34,"sourceLine":758,"id":"mc-G-034","prompt":"다음 훈령 내용 중 틀린 것은?","choices":["비밀문서는 최초 생산 시부터 비밀표시를 하여야 한다.","비밀은 최초 비밀지정권자가 결재한 때부터 비밀로 지정된다.","개인번호는 비밀을 보관 관리하는 단위 부서 내에 동일한 번호가 중복되지 않도록 각급 부대장이 부여한다.","비밀을 접수하거나 발송할 때에는 그 사실을 확인하기 위하여 비밀접수증을 사용한다."],"answers":[2],"note":"27조 / ③ 보관책임관(정)"},{"type":"mc","afccs":false,"number":35,"sourceLine":766,"id":"mc-G-035","prompt":"보안사고자 및 위반자 처리 내용에 대해 틀린 것은?","choices":["보안사고 조사결과 고의성·피해정도 등을 고려하여 가중처벌할 수 있으며, 세부절차는 「국방부 군인·군무원 징계업무처리 훈령」을 따른다.","징계위원 중 보안주무부서 인원 2명을 징계위원으로 위촉","심의과정에서 보안위반 내용에 대한 보충설명 필요시 지원 방첩부대원 참석","경고대상에게는 해당부대(기관)장 책임 하 본인에게 소명기회를 부여한다."],"answers":[1],"note":"194조 / ② 1명"},{"type":"mc","afccs":false,"number":36,"sourceLine":774,"id":"mc-G-036","prompt":"보안사고 조사 착수 시기로 틀린 것은?","choices":["국정원이 보안사고로 판단할 경우","국군방첩사령관이 보안사고로 판단할 경우","국방부 장관이 조사를 지시할 경우","보안사고 부대 또는 부서(비밀 생산부서 등)에서 조사를 요청할 경우"],"answers":[0],"note":"190조 / ① 국정원(X), 국군방첩사령관은 보안사고로 판단 시 조사 착수"},{"type":"mc","afccs":false,"number":37,"sourceLine":782,"id":"mc-G-037","prompt":"보안사고자 및 위반자 처리 방법 중 틀린 것은?","choices":["보안사고(위반)자는 별표 5 및 별표 5의2에 따라 처리한다.","보안사고 조사결과 고의성·피해정도 등을 고려하여 가중처벌할 수 있다.","징계위원회는 징계권자의 징계요구일부터 15일 이내에 심의·의결한다.","징계위원 중 보안주무부서 인원 1명을 징계위원으로 위촉한다."],"answers":[2],"note":"194조 / ③ 30일"},{"type":"mc","afccs":false,"number":38,"sourceLine":790,"id":"mc-G-038","prompt":"보안사고 조사시 부대 및 개인에게 요구할 수 없는 사항은?","choices":["심리생리 검사에 동의한 경우 보안사고와 관련된 범위내에서 조사","정보체계 로그 및 송·수신 자료","개인 스마트폰내 금융거래기록 등 조사와 무관한 민감정보","휴대폰 포렌식에 동의한 경우 당사자의 참여 기회를 보장하고 보안사고와 관련된 범위에서 전자정보 제공"],"answers":[2],"note":"192조 / ③ 개인 민감정보는 해당사항 없음"},{"type":"mc","afccs":false,"number":39,"sourceLine":798,"id":"mc-G-039","prompt":"보안사고 조사결과 조치 사항으로 틀린 것은?","choices":["암호장비 및 보안자재·암호키 사고시에는 국군방첩사령관의 보안판단에 따라 변경한다.","보안업무규정 제38조의2에 따라 국정원장으로부터 보안사고 조사 결과를 통보받은 경우 결과와 관련된 조치 후, 결과를 국정원장에 통보한다.","각급부대의 장은 조사결과 내용에 의거 필요한 조치 후 결과를 국방부 장관에게 보고만 하면 된다.","국군방첩사령관은 보안감사시 보안위반에 대한 조사결과는 해당 대에만 통보한다."],"answers":[2],"note":"193조 / ③ 국방부장관(국방정보본부장)에게 보고하고 국군방첩사령관에게 통보해야 함."},{"type":"mc","afccs":false,"number":40,"sourceLine":806,"id":"mc-G-040","prompt":"보안사고(위반) 발생시 보고사항으로 옳은 것을 모두 고르시오.","choices":["사고일시 및 장소","사고 내용(6하 원칙에 의거 기술)","사고자 인적사항","보안사고(위반)자 상급자 의견서"],"answers":[0,1,2],"note":"191조 / 상급자 의견서는 불필요함"},{"type":"mc","afccs":false,"number":41,"sourceLine":814,"id":"mc-G-041","prompt":"비밀의 분류에 대한 설명 중 틀린 것은?","choices":["적절히 보호할 수 있는 최저 등급으로 분류해야 한다.","제대별로 내용과 가치의 정도에 따라 차등 분류해야 한다.","암호장비는 Ⅱ급 비밀로 분류하고, 암호자재 및 음어자재는 Ⅲ급비밀로 분류해야 한다.","보호가치가 없는 정보의 공개를 제한할 목적의 비밀이 아닌 사항을 비밀로 분류하면 안된다."],"answers":[2],"note":"18조 / ③ 암호자재(X)"},{"type":"mc","a  보안점검을 실시하여 취약점을 해소하여야 한다."],"answers":[3],"note":"217조 / ④ 반기 1회 이상"},{"type":"mc","afccs":false,"number":94,"sourceLine":1242,"id":"mc-G-094","prompt":"장성급 부대장의 보안대책 검토 대상이 아닌 것은?","choices":["군 경계를 지원받는 영내 시설에 국방정보체계 PC를 추가 설치 때","부대의 민간 위탁시설에 군 정보통신망과 연동되지 않는 상용 인터넷을 설치할 경우","IPTV 등 군 정보통신망과 연동되지 않는 상용 인터넷을 설치할 경우","정보통신시스템을 망 대 망으로 연동 및 통합할 때"],"answers":[3],"note":"100조 / ④ 지원방첩부대장"},{"type":"mc","afccs":false,"number":95,"sourceLine":1250,"id":"mc-G-095","prompt":"각급부대의 장은 군사보안시설 및 보호장비 관리에 필요한 보안대책을 강구하여야 하며, 경계부대와 통합하여 보안순찰을 실시하여야 한다. 옳지 않은 것은?","choices":["가급 : 월 1회 이상","나급 : 분기 1회 이상","다급 : 반기 1회 이상","라급 : 연 1회 이상"],"answers":[3],"note":"93조 / ④ 라급은 미존재함"},{"type":"mc","afccs":false,"number":96,"sourceLine":1258,"id":"mc-G-096","prompt":"개인용 컴퓨터(PC) 등 단말기 보안관리 지침 中 옳지 않은 것은?","choices":["각급부대의 장은 PC에 망전환 장치를 설치·사용할 수 없도록 하여야 한다.","PC 또는 저장매체를 교체·반납·폐기하고자 할 경우 자료를 복구할 수 없도록 소거하여야 한다.","PC의 공유기능이 필요한 경우에는 비밀자료에 한하여 비밀번호를 설정하여 운용할 수 있으나, 작업 후 즉시 공유서비스를 해제하여야 한다.","통제구역 내에 설치된 단말기는 각종 정보통신망에 연결되지 않았을 경우 하드디스크에 비밀자료를 보관할 수 있으며 타인과 공동 사용 시 별도의 운영체제 사용자 계정으로 로그인하여 관리하여야 한다."],"answers":[2],"note":"142조 / ③ 일반자료"},{"type":"mc","afccs":false,"number":97,"sourceLine":1266,"id":"mc-G-097","prompt":"비밀이력카드 작성 제외 대상이 아닌 것은?","choices":["지휘통제실내 보관중인 상황판 및 차트자료(브리핑용 비밀자료 포함)","비밀바인더","수정·부분대체·추가 비밀","정기적으로 생산 및 접수받은 비밀을 1건으로 합철 시 각각의 비밀"],"answers":[1],"note":"32조 / ② 비밀바인더는 작성 제외 대상이 아님"},{"type":"mc","afccs":false,"number":98,"sourceLine":1274,"id":"mc-G-098","prompt":"보안담당관의 임명 및 임무 설명 중 옳지 않은 것은?","choices":["부대 및 기관의 전반적인 보안에 대한 조정·감독업무를 수행한다.","보안담당관은 일일보안 이행상태 확인/감독업무를 수행한다.","보안담당관은 보안시스템 운용과 보호 업무를 수행한다.","보안담당관은 보안교육에 관한 사항 및 비밀취급 인사 및 취소에 관한 업무를 수행한다."],"answers":[2],"note":"74조 / ③ 정보통신 분임보안담당관"},{"type":"mc","afccs":false,"number":99,"sourceLine":1282,"id":"mc-G-099","prompt":"보안 일일결산 및 사이버·보안 진단의 날 관련 괄호안에 포함될 내용은?\n[개인 및 사무실의 일일 보안점검관(당직근무자 포함)은 사무실 내 잠금장치, 비밀 방치, 음어·약호자재, 비밀 보관용기 및 시설, 전원 등의 이상유무를 점검하고 ( )은 보안결산 결과를 확인하여야 한다.]","choices":["보안점검관","장성급 부대(서)장","편제상 영관급 이상 부대장","보관책임관 '정'"],"answers":[3],"note":"217조"},{"type":"mc","afccs":false,"number":100,"sourceLine":1291,"id":"mc-G-100","prompt":"비밀의 분류에 관한 설명 중 옳지 않은 것은?","choices":["비밀은 제대별로 내용과 가치의 정도에 따라 차등 분류하여야 한다.","비밀은 그 자체의 내용과 가치의 정도에 따라 분류하여야 하며, 타 비밀과 관련하여 분류하여서는 아니 된다.","비밀은 적절히 보호할 수 있는 최고등급으로 분류하여야 한다.","암호장비는 Ⅱ급 비밀로 분류하고, 음어자재는 Ⅲ급 비밀로 분류하여야 한다."],"answers":[2],"note":"18조 / ③ 최저등급"},{"type":"mc","afccs":false,"number":101,"sourceLine":1299,"id":"mc-G-101","prompt":"다음 해당 괄호안에 포함할 내용으로 옳은 것은?\n[1. 비밀을 접수하거나 발송할 때에는 그 사실을 확인하기 위하여 ( )을 사용한다.\n2. ( )은 생산부서에서 접수일자, 이상시의 사유 및 접수자란을 제외한 모든 해당사항을 기재하고 그 비밀문서에 첨부하여 발송한다.\n3. 비밀관리기록부를 사용하여 직접 수발할 때에는 ( )을 사용하지 아니한다.]","choices":["비밀이력카드","비밀바인더","비밀접수증","접수용 비밀관리기록부"],"answers":[2],"note":"37조"},{"type":"mc","afccs":false,"number":102,"sourceLine":1310,"id":"mc-G-102","prompt":"다음은 경호 정보통신 보안 관련 설명으로 올바르지 않은 것은?","choices":["국가원수에 대한 경호 행사는 지정된 경호 정보통신망을 이용한다.","국가원수에 대한 비공개 행사계획이나 행사 중인 동정은 통신할 수 없다.","수시 경호작전지원부대(수방사·15특임단·계룡대 근무지원단·국방부 등)는 반기 1회 통합으로 보안측정을 의뢰할 수 있다.","경호정비사령관은 행사 前 경호작전 병력 대상 통신보안 교육을 실시하여야 한다."],"answers":[2],"note":"109조 / ③ 연 1회"},{"type":"mc","afccs":false,"number":103,"sourceLine":1318,"id":"mc-G-103","prompt":"도청 방지 보안대책 설명으로 올바르지 않은 것은?","choices":["장성급 장교 및 이와 동등한 직위자가 지휘하는 각급부대의 장은 도청에 따른 정보유출을 방지하기 위하여 도청 방지 보안대책을 보안 예규에 반영하여야 한다.","대도청 측정은 비공개로 실시하여야 하나 계획과 결과 등 관련내용은 외부에 공개할 수 있다.","국군방첩사령관은 각급부대 중요시설에 대하여 대도청 측정이 필요하다고 인정될 경우 해당 부대장의 동의를 받아 실시한다.","대도청 측정 시행 15일 전까지 지원 방첩부대장에게 목적, 희망 일자, 대상 시설(장소) 등을 포함하여 요청하여야 한다."],"answers":[1],"note":"104조 / ② 대도청 측정 계획 및 결과 외부 공개 금지"},{"type":"mc","afccs":false,"number":104,"sourceLine":1326,"id":"mc-G-104","prompt":"비밀취급 인가 취소 대상으로 올바르지 않은 것은?","choices":["업무 수행간 경징계 처벌을 받았을 경우","신체 또는 정신상의 이상으로 직무를 담당할 수 없는 경우","비밀취급이 불필요하게 된 경우(전직지원교육 입교, 공로연수 파견 등)","고의 또는 중대한 과실로 보안사고를 범하였거나 보안업무규정을 위반하여 보안업무에 지장을 초래한 경우"],"answers":[0],"note":"68조 / ① 경징계 처벌(X)"},{"type":"mc","afccs":false,"number":105,"sourceLine":1334,"id":"mc-G-105","prompt":"암호화 전문통신 보호 관련 해당 괄호안에 포함할 내용으로 옳은 것은?\n[암호화하여 통신한 전문은 용지 전면 여백에 사용한 암호장비 또는 ( ) 명칭과 사용일시를 기재하여야 한다.]","choices":["암호 자재","보안 자재","약호 자재","음어 자재"],"answers":[1],"note":"107조"},{"type":"mc","afccs":false,"number":106,"sourceLine":1343,"id":"mc-G-106","prompt":"다음 비밀관계 서류의 보존기간이 올바르지 않은 것은?","choices":["비밀관리기록부 : 관리기록부 이기 후 5년","신원조사대상자명부 : 연 단위 종합 후 다음 해부터 5년","재분류 및 예고문 변경철 : 연 단위 종합 후 다음 해부터 5년","각종 로그파일 : 연 단위 종합 후 다음 해부터 5년"],"answers":[3],"note":"219조 / ④ 2년"},{"type":"mc","afccs":false,"number":107,"sourceLine":1351,"id":"mc-G-107","prompt":"비밀회의자료 생산·관리를 올바르게 설명하지 않은 것은?","choices":["회의 참석자에게 배부하기 위한 비밀회의(각종 업무 보고서 등을 포함한다.) 자료는 사본번호를 부여하여야 한다.","회의 종료와 동시에 회수하여 파기할 자료는 접수용 비밀관리기록부에 등재된 원본의 비밀이력카드에 사본부수(사본번호) 및 파기근거를 기록하여야 한다.","각급부대 자체의 정기적인 회의자료 중 비밀내용은 별도의 비밀회의 자료침에 보관하고 목록표를 부착하여 기록, 유지하여야 하며, 접수용 비밀관리기록부에 철별로 등재하여야 한다.","종합하는 부서에 비밀 회의자료를 제출할 때에는 사본을 생산하여 제출하여야 한다. 다만, 작업 중(초안)인 상태에서 제출할 때에는 발송용 비밀관리기록부에만 기록하고, 제공 후에는 문서 또는 파일(File)을 생산하여 등재하여야 한다."],"answers":[3],"note":"205조 / ④ 발송용 비밀관리기록부 이용 제공, 제공 후 문서·파일은 파기 및 소거"},{"type":"mc","afccs":false,"number":108,"sourceLine":1359,"id":"mc-G-108","prompt":"바이러스 감염이 발견되었을 때 필요한 조치가 아닌 것은?","choices":["바이러스 감염 피해를 최소화하기 위하여 감염된 시스템 네트워크 분리","바이러스 감염현장(시스템)을 보존하고 침해사고 대응반 및 방첩부대에 신고","바이러스 감염 확산 방지를 위해 부대 내 사용자에게도 관련 사실을 비밀로 한다.","바이러스 백신프로그램을 이용하여 정상 복구"],"answers":[2],"note":"127조 / ③ 비밀(X), 전파해야 함"},{"type":"mc","afccs":false,"number":109,"sourceLine":1367,"id":"mc-G-109","prompt":"상용 정보통신 장비 설치·운용에 관한 설명 중 옳지 않은 것은?","choices":["업무용 휴대전화는 통제구역 내에서 필요할 경우에 한하여 장성급 부대(서)장 승인하에 보안대책 강구 하 사용할 수 있다.","국가용 보안시스템, 군 전용 암호모듈 등을 사용 시에는 각각 인가된 등급 이하의 비밀이나 비공개 업무자료를 소통할 수 있다.","상용무전기 또는 드론을 군사목적으로 사용할 때에는 지원 방첩부대장의 승인을 받아야 한다.","군 영내에 민간소유 자산인 통신 중계기 유지보수 및 점검 시에는 보안담당관이 확인하여야 한다."],"answers":[2],"note":"112조 / ③ 장성급 부대장"},{"type":"mc","afccs":false,"number":110,"sourceLine":1375,"id":"mc-G-110","prompt":"Ⅱ·Ⅲ급 비밀의 재분류 및 예고문 변경 관련 옳지 않은 것은?","choices":["동급부대 및 하급부대 또는 조정·감독을 받는 부대는 그 비밀 생산 부대의 승인을 받아 재분류 및 예고문 변경이 가능하다.","대외기관으로부터 접수한 비밀은 발행기관의 승인을 받아 재분류 및 예고문 변경이 가능하다.","예고문을 변경하고자 할 경우 원본비밀은 문서 전자결재시스템을 통해 보관책임관 \"정\"의 승인을 받는다.","상급부대는 접수한 비밀을 직권으로 재분류 또는 예고문 변경한 때에는 이를 생산부대에 통보하여야 하며, 생산부대는 그 비밀이 배부된 모든 부대에 재분류한 또는 예고문 변경 결과를 통보"],"answers":[2],"note":"51조 / ③ 비밀지정권을 가진 결재권자의 승인"},{"type":"mc","afccs":false,"number":111,"sourceLine":1383,"id":"mc-G-111","prompt":"인터넷 설치 관련 옳지 않은 것은?","choices":["학위 교육(사관학교, 국방대학교)을 목적으로 설치하는 학술용 인터넷의 운영에 관한 사항은 해당 학교의 '학술용 인터넷 운용 예규'에 따르며, 예규 제·개정 시 해당 학교장의 승인을 받아야 한다.","국방 IPTV 등 병영생활 및 복지 관련 설치시에는 장성급 부대장의 보안대책 검토 및 승인을 받아야 한다.","군 정보통신망이 설치된 장소에는 상용 인터넷(군 인터넷 제외)을 설치할 수 없다. 다만, 특수 업무 목적으로 설치가 필요한 경우에는 일반시설구역의 경우 장성급 부대장의 보안대책 검토 승인을 받아야 한다.","빅데이터·AI 등 신기술 연구개발 목적로 연구기관 내 설치하는 상용 인터넷의 운용에 관한 사항은 해당기관에서 작성한 연구·개발용 인터넷 운용 예규에 따르며, 예규 제·개정시 국방부장관(국방정보본부장) 승인을 받아야 한다."],"answers":[0],"note":"139조 / ① 국방부장관(국방정보본부장)"},{"type":"mc","afccs":false,"number":112,"sourceLine":1391,"id":"mc-G-112","prompt":"보안사고(위반)자 처리기준 상 중징계 사항이 아닌 것은?","choices":["비밀을 승인 없이 숙소 또는 영외로 지출","일반 군사자료 제공·설명·공개 시 보안성검토 미실시","비밀을 고의로 파기","비밀 분실·도난 등 보안사고 인지 후 미신고"],"answers":[1],"note":"별표 5 보안사고(위반)자 처리기준 / ② 경징계"},{"type":"mc","afccs":false,"number":113,"sourceLine":1399,"id":"mc-G-113","prompt":"보안사고·위반 관련 괄호안에 포함할 내용은?\n[비밀의 누설·분실 등 보안사고와 보안위반자를 발견하거나 보안위반 내용을 인지하였을 때에는 해당부대 ( ) 및 ( )에게 신고하고 이를 ( )으로 보고하여야 한다.]","choices":["보안담당관, 보관책임관, 보안장교","보안담당관, 방첩부대장, 지휘계통","보관책임관, 정보처(보안과), 상황계통","보안담당관, 지휘관, 지휘계통"],"answers":[1],"note":"95조"},{"type":"mc","afccs":false,"number":114,"sourceLine":1408,"id":"mc-G-114","prompt":"정신보안 관련 괄호안에 포함할 내용은?\n[정신보안이란 장병들의 ( ) 수준을 제고시켜 ( )를 예방하는 등 완벽한 군사보안태세 확립을 위한 제반 대책과 활동을 말한다.]","choices":["대비태세, 비밀누설","정신보안, 보안사고","보안의식, 보안위반","보안의식, 보안사고"],"answers":[3],"note":"13조"},{"type":"mc","afccs":false,"number":115,"sourceLine":1417,"id":"mc-G-115","prompt":"비밀 지정권자 및 관리번호 관련 올바른 것은?","choices":["중령급 부대장 및 참모는 Ⅱ·Ⅲ비밀을 지정할 수 있다.","개인 비밀관리번호는 부서 보안담당관이 부여할 수 있다.","2부이상 동일비밀을 접수시 동일한 관리번호를 부여할 수 있다.","원칙적으로 상황 일지는 철 단위로 관리번호를 부여할 수 없다."],"answ ","afccs":false,"number":121,"sourceLine":1466,"id":"mc-G-121","prompt":"접수용 비밀관리기록부 관리 관련 괄호안에 포함할 내용은?\n[생산되는 비밀은 비밀지정권을 가진 ( )가 결재한 후에 등재하고, 접수되는 비밀은 접수 ( ) 등재한다. 다만, 일과 이후 또는 공휴일에 접수된 비밀은 ( ) 등재하되, 24시간 근무하는 상황실 등은 접수 즉시 등재하고 모사전송으로 발송되는 비밀의 원본은 발송 후 등재한다.]","choices":["비밀생산자, 즉시, 즉시","관리책임관 '정', 승인 후, 정상","최종 결재권자, 즉시, 다음날","관리책임관 '정', 즉시, 당직근무자"],"answers":[2],"note":"30조"},{"type":"mc","afccs":false,"number":122,"sourceLine":1475,"id":"mc-G-122","prompt":"접수용 비밀관리기록부 관련 옳은 것은?","choices":["비밀관리기록부 보관기간은 관리기록부 이기 후 3년이다.","비밀관리기록부를 갱신 필요시 사용하던 비밀관리기록부에서 삭제된 것을 포함하여 모든 비밀은 새로운 비밀관리기록부에 이기하여야 한다.","새로운 비밀관리기록부의 최종으로 기록된 난의 밑에 갱신일자와 이기된 비밀 건수, 갱신 기록자를 기재한 후 관리책임관 \"정\"이 확인 서명을 한다.","훈련(연습) 기간에 생산 및 접수된 비밀은 별도 접수용 비밀관리기록부를 작성, 유지하되 표지 상·하단에 \"훈련(연습)\" 표시를 하여야 한다."],"answers":[3],"note":"31조 / ① 5년 ② 삭제된 것은 제외 ③ 보관책임관(정)"},{"type":"mc","afccs":false,"number":123,"sourceLine":1483,"id":"mc-G-123","prompt":"비밀의 재분류 및 예고문 변경 관련 올바른 것은?","choices":["Ⅱ·Ⅲ급 비밀이 원본일 경우 비밀지정권을 가진 결재권자가 직권 변경 가능하다.","Ⅱ·Ⅲ급 비밀이 원본일 경우 비밀의 생산자가 직권 변경 가능하다.","Ⅱ·Ⅲ급 비밀이 사본일 경우 상급부대는 지휘·통제, 업무상 조정·감독을 받는 예하부대가 생산한 비밀에 대해 생산부대(인원) 동의를 얻어 변경한다.","Ⅱ·Ⅲ급 비밀이 사본일 경우 하급부대는 비밀 생산부대의 승인없이 비밀지정권자가 직권 변경 가능하다."],"answers":[0],"note":"51조 / ② 비밀지정권을 가진 결재권자 ③ 생산부대 동의 불필요 ④ 비밀 생산부대의 승인을 얻어 변경 가능"},{"type":"mc","afccs":false,"number":124,"sourceLine":1491,"id":"mc-G-124","prompt":"개인별 비밀보관 관리시 비밀 인수인계 관련 사항으로 옳은 것은?","choices":["보관책임관 \"정\"이 교체될 때에는 업무 인수인계서에 비밀 소유현황(이관대기 목록표 제외), 비밀보관 용기, 비밀관계서류 현황 및 개인번호 등을 포함한다.","보관책임관 \"부\"가 교체될 때에는 비밀 소유현황, 보관용기 이상 유무를 확인 후 접수용 비밀관리기록부의 최종으로 기록된 난의 밑에 비밀건수, 인수인계 일자 및 인수·인계자를 기재하고 보안담당관이 확인 서명한다.","보관책임관 \"부\"가 보유하고 있는 일부 비밀을 다른 인원에게 인계할 때에는 발송용 비밀관리기록부에 기록 후 수령란에 서명을 받은 후 인계한다.","보관책임관 \"부\"가 교체될 때에는 별도의 인수인계 기록 없이 이상유무만 확인한다."],"answers":[2],"note":"44조 / ① 이관대기 목록표 포함 ② 보관책임관(정) 확인 서명 ④ 인수인계 필요"},{"type":"mc","afccs":false,"number":125,"sourceLine":1499,"id":"mc-G-125","prompt":"비밀 복제·복사 관련 옳은 것은?","choices":["결재를 받기 위하여 일시적인 요약지에는 비밀 등급 표시는 불필요하다.","문건 복사 시 해당 복사기 및 스캐너 사항, 비밀취급 인가 및 취소에 관한 업무","비밀의 소유현황 조사 및 재분류 검토 사항","보안조치, 보안성 검토에 관한 업무"],"answers":[2],"note":"74조 / ③ 보관책임관(부)의 임무"},{"type":"mc","afccs":false,"number":138,"sourceLine":1605,"id":"mc-G-138","prompt":"다음 임무를 수행하는 인원으로 올바른 것은?\n[군 관련 보도내용 확인 후 군사비밀 누설 의심 내용을 보안부서에 통보]","choices":["보안담당관","보관책임관 \"부\"","보안확인관","부대 공보관계관"],"answers":[2],"note":"191조의 2"},{"type":"mc","afccs":false,"number":139,"sourceLine":1614,"id":"mc-G-139","prompt":"다음 중 올바르지 않은 것은?","choices":["단일문서로 된 비밀은 이를 분리될 수 없도록 철하여 관리하여야 한다.","비밀공사 설계도 및 회의록 등 분야별로 구분이 되는 비밀을 계속적으로 분리 사용할 필요가 있을 때에는 보관책임관 \"정\"의 승인을 받아 분리 할 수 있다.","비밀을 계속적으로 분리 사용시 비밀이력카드에 등재하여 관리번호를 부여한다.","일시적으로 분리된 비밀의 대출시에는 사용 후 원상태로 철하여 보관한다."],"answers":[2],"note":"43조 / ③ 접수용 비밀관리기록부"},{"type":"mc","afccs":false,"number":140,"sourceLine":1622,"id":"mc-G-140","prompt":"보안성 검토 대상으로 올바르지 않은 것은?","choices":["홍보 및 보고자료","연구 및 학술 기술자료","대외제공·설명·공개되는 자료","동기회 수첩"],"answers":[1],"note":"201조 / 학술 및 기술자료는 보안성 검토 대상이 아님"},{"type":"mc","afccs":false,"number":141,"sourceLine":1630,"id":"mc-G-141","prompt":"보안담당관이 교체될 때에는 소관업무에 대하여 인수인계서를 작성하여 부대장에게 보고하고 확인 서명을 받아야 한다. 인수인계서에 포함될 사항이 아닌 것은?","choices":["비밀 소유 및 비밀취급 인가자 현황","부대 출입 외국인 현황","비밀 이관대기 현황","최근 보안감사 현황"],"answers":[1],"note":"75조 / ② 부대 출입 외국인 현황은 해당사항 없음"},{"type":"mc","afccs":false,"number":142,"sourceLine":1638,"id":"mc-G-142","prompt":"외국인 고용 및 접촉시 보안대책 설명으로 올바르지 않은 것은?","choices":["보안담당관은 채용 또는 계약 30일 전에 신원조사 업무처리 지침에 따라 지원 방첩부대에 신원조사를 요청하여야 한다.","비밀회의 시에는 외국인을 참석시킬 수 없다. 다만, 업무수행 상 필요한 경우에는 서약서 집행 등 보안대책 강구 후 참석시킬 수 있다.","군사자료를 설명할 경우에는 공식적인 내용 이외 설명자 또는 부대의 자의적 판단 내용을 부가하여 설명할 수 없다.","진료목적 군병원 출입이나 외국군 수탁교육 등 공무목적이 아닌 경우에도 접촉결과를 보고하며, 이러한 사항은 「군 방첩업무훈령」을 적용한다."],"answers":[3],"note":"85조 / ④ 공무목적이 아닌 경우 접촉결과 보고 생략, 군 방첩업무훈령 미적용"},{"type":"mc","afccs":false,"number":143,"sourceLine":1646,"id":"mc-G-143","prompt":"적에게 파괴 또는 피탈시 국방에 중요한 영향을 미치게 되는 군사시설과 장비를 군사보안시설 및 보호장비로 설정, 보호하여야 한다. 이에 대한 설명으로 틀린 것은?","choices":["군의 임무수행에 막대한 차질을 초래할 시설 및 장비는 '가급'으로 설정한다.","장성급 부대의 장이 군사보안시설 및 보호장비를 설정, 보호하여야 한다.","동일 울타리 내에 있는 수 개의 보안시설은 각각의 군사보안시설에 적합한 등급을 부여하여 해당 부대별로 관리한다.","각급부대의 장은 군사보안시설 및 보호장비의 설정, 등급변경, 해제를 할 때에는 관련부대(기관) 참여 하 보안심사위원회를 거쳐야 한다."],"answers":[0],"note":"91조 / ② 나급"},{"type":"mc","afccs":false,"number":144,"sourceLine":1654,"id":"mc-G-144","prompt":"상용 전화 및 FAX 설치·운용에 관한 설명으로 올바르지 않은 것은?","choices":["일반 체신전화는 영관급 장교 이상 부대장의 승인을 받아 설치하여야 한다.","공중전화는 영관급 장교 이상 부대장의 승인을 받아 장병이 편리하게 이용할 수 있는 장소에 설치한다.","상용 FAX의 경우, 각 군은 편제상 장성급 부대장 또는 각 군 총장이 지정하는 영관급 부대장, 국직부대 및 기관은 국직부대 및 기관의 장의 승인이 필요하다.","상용 FAX 자료 송신 시 결재권자 또는 부서장의 보안성 검토를 받은 후 해당문서(자료)의 우측 상단에 표시하여 송신하여야 한다."],"answers":[1],"note":"113조 / ② 장성급 부대장"},{"type":"mc","afccs":false,"number":145,"sourceLine":1662,"id":"mc-G-145","prompt":"전자적 수단에 의한 비밀 처리에 대한 설명으로 올바르지 않은 것은?","choices":["비밀을 전자적으로 생산하고자 할 때에는 해당 비밀등급과 예고문을 입력하여 열람 또는 출력 시 자동으로 표시되도록 하여야 한다.","비밀을 전자적으로 처리 시에는 관련규격에 따른 제반사항을 전자적으로 기록 유지하여야 한다.","전자적으로 처리되는 체계 내에서 비밀 작업시 목록표를 유지할 필요는 없으며, 비밀 생산을 완료한 경우에는 PC내 비밀내용은 보관 가능하다.","전장관리정보체계 등 비밀을 취급하는 정보통신망은 인터넷 등 상용망과 분리 운용한다."],"answers":[2],"note":"116조 / ③ 비밀 작업시 목록표는 유지하지 않을 수 있고, 비밀 생산 완료시 PC 내 비밀내용 보관은 금지함"},{"type":"mc","afccs":false,"number":146,"sourceLine":1670,"id":"mc-G-146","prompt":"정보시스템 보안관리에 대한 설명으로 올바르지 않은 것은?","choices":["각급부대의 장은 정보체계 자산의 유형별로 기밀성, 무결성, 가용성에 대한 자산의 중요도와 위험을 평가하여 보안대책을 수립하여야 한다.","정보통신시스템에 접근이 허용된 외국인에 대해서는 수시 감독하여야 하며, 업무 종료 이후에도 접근이 가능하도록 허용해야 한다.","시스템관리자는 사용자계정 및 비밀번호 입력이 5회에 걸쳐 일치하지 않을 경우에는 정보통신시스템 접속을 중지시키고 비인가자 침입 여부를 확인·점검하여야 한다.","정보시스템 및 서비스에 대한 접근통제를 위해 정보의 중요도와 위험에 따라 암호모듈, 인증서, 생체인증 기술 등 안전한 인증수단을 사용하여야 한다."],"answers":[1],"note":"122조 / ② 업무 종료 이후 접근 금지"},{"type":"mc","afccs":false,"number":147,"sourceLine":1678,"id":"mc-G-147","prompt":"전산자료 보안관리에 대한 설명으로 올바른 것은?","choices":["시스템관리자는 각종 소프트웨어를 단말기, 서버 등에 설치할 경우 운영 및 유지보수간 신고접수를 통해 유해성 여부를 확인해야 한다.","운영시스템의 변경 및 임의사용은 부서장 승인하에 가능하다.","실행파일 형태의 무·유료SW는 중령급 부대장이 승인한 제품에 한해 자체 바이러스 검사 등 유해성 확인 후 군 정보통신망에서 활용할 수 있다.","각급부대의 장은 비밀로 분류되지 않은 전산자료(DB)보호를 위하여 전산자료의 보호수준을 분류하고, 세부적인 등급 분류는 각급부대 보안규정(예규)에 정할 수 있다."],"answers":[3],"note":"129조 / ① 미리 유해성 여부 확인 ② 각급 부대의 장 ③ 장성급 부대장"},{"type":"mc","afccs":false,"number":148,"sourceLine":1686,"id":"mc-G-148","prompt":"네트워크 보안관리에 대한 설명으로 올바르지 않은 것은?","choices":["무선 LAN을 이용하여 비밀 업무체계 운용 시에는 무선구간 보호를 위해 납품업체 자체 이상 검증된 무선용 암호장비, 전용 단말기를 사용한다.","무선 LAN을 통해 승인된 비밀 등급 이상의 자료는 소통할 수 없다.","비밀등급이 높은 자료는 낮은 망으로 전송을 금지한다.","자료 전송은 서버 간 직접 연동할 수 없으며 반드시 연동장비를 통해서만 수행한다."],"answers":[0],"note":"133조 / ① 국가기관용으로 승인된 무선용 암호장비, 전용 단말기 사용"},{"type":"mc","afccs":false,"number":149,"sourceLine":1694,"id":"mc-G-149","prompt":"각급부대의 장은 부대 연간 교육계획에 보안교육을 포함하여 수립 시행해야 한다. 이에 대한 설명으로 올바르지 않은 것은?","choices":["보안교육은 정신보안교육(작전보안교육 등)과 보안실무 교육으로 구분","사이버·보안진단의 날 등을 활용하여 월 2시간 이상 실시","교육진행 실적은 별도 기록, 유지 불필요","실무장병, 군인가족, 해외여행자 등과 같이 대상자별로 교안을 작성 시행"],"answers":[2],"note":"209조 / ③ 교육진행 실적 별도 기록 및 유지"},{"type":"mc","afccs":false,"number":150,"sourceLine":1702,"id":"mc-G-150","prompt":"비밀 외주용역에 대한 설명으로 올바르지 않은 것은?","choices":["훈령의 적용을 받지 않는 민간연구기관, 단체, 업체 또는 개인에게 비밀에 대한 용역을 의뢰할 수 있다.","용역을 의뢰할 기관의 단체나 업체의 대표 또는 개인에게 비밀보호특약의 이행에 관한 서약을 집행한다.","각급부대에서는 비밀 용역사업 수행관련 업체 직원에 대한 신원조사를 실시한다.","용역사업 관련 자료 회수 및 삭제 조치 후 “용역 사업 관련 자료를 보유하고 있지 않다”라는 실무자의 확인서를 받아야 한다."],"answers":[3],"note":"별표 15 외주 용역사업 보안관리 7조 4항 / ④ 대표명의 확인서"},{"type":"mc","afccs":true,"number":1,"sourceLine":1711,"id":"mc-A-001","prompt":"연습모드는 주요 연습간 활용을 위해 최적화 작업을 시행하여야 한다. 다음 중 올바르지 않은 것은?","choices":["연습/훈련을 위한 권한 그룹은 최소화하여 운영하여야 한다.","연습 ID는 각 부대 훈련조직도에 각 연습조직에 부합되도록 생성하여야 한다.","상급부대 연습 참관시에는 타부대 사용자 ID를 실 조직도에 생성하여 사용한다.","연습ID는 목적에 맞게 사용하여야 한다. 목적에 부합하지 않는 ID는 작전사령관(체계과장)이 검토하여 임의 삭제하거나 삭제 요청할 수 있다."],"answers":[2],"note":"공군 C4I체계 운영지침서 41조 / ① 생성 금지"},{"type":"mc","afccs":true,"number":2,"sourceLine":1719,"id":"mc-A-002","prompt":"연습모드 운영/관리와 관련하여 올바르지 않은 것은?","choices":["연습모드 내 훈련조직도가 아닌 조직상의 연습 ID는 작전사령관(체계과장)이 임의 삭제하거나 삭제 요청할 수 있다.","분야별 훈련 목적의 연습 ID 필요시 훈련을 주관하는 부대(서)의 담당자가 작전사령관(체계과장), 작전정보통신단장(체계개발실장)에게 요청하여야 한다.","연습간 탑재한 연습자료는 연습 종료 후 차후 연습시 활용할 자료에 한 해 연습모드 내 임시로 저장할 수 있다.","연습모드 내 전자결재체계의 원활한 운영을 위하여 연습간 유통한 전자문서는 연습이 끝난 후 1개월 경과시 초기화하여야 한다."],"answers":[2],"note":"공군 C4I체계 운영지침서 41조 / ③ 임시 저장(X), 초기화"},{"type":"mc","afccs":true,"number":3,"sourceLine":1727,"id":"mc-A-003","prompt":"체계 운영/관리와 관련하여 올바르지 않은 것은?","choices":["비밀 작성간 비밀문서 폴더 자체를 반드시 자동암호화 폴더로 설정되게 하여야 한다.","AFCCS 단말기에서는 다중 사용자 등록 정책운영상 단말기 내에 있는 다른 사용자의 비밀열람을 방지하기 위하여 파일별 자체 암호설정을 하여야 한다. 단, 전자문서에 붙임 문서로 활용시 파일별 자체 암호설정을 해제하여야 한다.","부서장의 결재 후 문서가 발송되면 단말기 내 저장 비밀자료는 즉시 삭제하여야 한다.","비밀 송/수신은 전자결재체계를 통해서만 가능하다. 단, 30Mb 이상 대용량에 한하여 보호대책을 강구하여 AFCCS의 전자우편(이메일)을 통해 송/수신할 수 있다."],"answers":[3],"note":"공군 C4I체계 운영지침서 21조 13항 / ④ 자료관리체계"},{"type":"mc","afccs":true,"number":4,"sourceLine":1735,"id":"mc-A-004","prompt":"암호모듈 관리에 대한 내용 중 올바르지 않은 것은?","choices":["암호모듈을 사용하는 각급 부대(서)장은 보안시스템 운용책임관(정·부)을 인사명령으로 임명하여야 한다.","상황실 근무자(야간근무자 포함) 및 CREW 근무부서 근무자는 (상/하번 근무 교대 시) [별지 11] AFCCS 암호모듈(NEU-XXX) 인계/인수대장에 서명하여 기록을 유지하여야 한다.","AFCCS 단말기를 부대 간 이동 설치(이관) 시 암호장비의 설치장소 변경은 작전사령관(체계과장)에게 변경 승인을 상신하여야 한다.","AFCCS용 암호모듈(NEU-XXX)은 Ⅱ급 비밀까지 소통이 가능한 장비로 Ⅱ급 비밀에 준하여 관리하여야 한다."],"answers":[2],"note":"공군 C4I체계 운영지침서 29조, 23조 8항 / ③ 공군참모총장(보안과장)"},{"type":"mc","afccs":true,"number":5,"sourceLine":1743,"id":"mc-A-005","prompt":"체계내 비밀생산 절차 중 올바르지 않은 것은?","choices":["AFCCS에서 생산된 비밀의 원본과 사본의 구분은 최종결재권자의 결재를 받은 전자·출력문서를 원본으로 하고 탑재·발송된 문서를 사본으로 한다.","전자결재체계의 임시보관함은 문서 기안지 작성 중 임시저장 작업등의 용도로 사용할 수 있으나 첨부파일을 포함하여 비밀내용은 저장할 수 없다.","AFCCS를 활용하여 비밀을 발송, 회송, 이첩 등을 할 경우 수기 발송용 비밀관리기록부에 관련 근거를 기록하여야 한다.","체계에서 접수한 비밀을 타부서로 이첩 시 재기안(이첩 기안)하여야 한다."],"answers":[2],"note":"공군 C4I체계 운영지침서 29조 1항 14호 / ③ 기록 불필요함"}];
    const QUESTION_MAP = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
    const EXAM_SETS = [{key:"ox",label:"OX 전체",type:"ox"},{key:"short",label:"주관식 전체",type:"short"},{key:"mc1",label:"객관식 1회",type:"mc"},{key:"mc2",label:"객관식 2회",type:"mc"},{key:"mc3",label:"객관식 3회",type:"mc"}];
    let records = {};
    let selectedItem = null;
    let firebaseReady = false;
    let database = null;
    let dataRef = null;
    let firebaseSet = null;
    let firebaseRemove = null;
    let syncTimer = null;
    let currentView = "home";
    let bankUi = {query:"",type:"all",category:"all",limit:30};
    let studyUi = {type:"ox",page:1};

    function defaultState(){return {
      schemaVersion:1,bankHash:DB_SCHEMA_HASH,updatedAt:0,
      cycle:{number:1,round:1,completed:0,used:{mc:[],ox:[],short:[]},wrongIds:[],examPlan:{mcIds:[],completed:{}}},
      progress:{},favorites:{},memory:{},daily:{},examHistory:[],generalSession:null,
      memorySession:null,currentExam:null,lastResult:null,settings:{theme:"system"}
    }}
    function mergeState(value){
      const base=defaultState(),v=value&&typeof value==="object"?value:{};
      return {...base,...v,bankHash:DB_SCHEMA_HASH,cycle:{...base.cycle,...(v.cycle||{}),used:{...base.cycle.used,...(v.cycle?.used||{})},examPlan:{...base.cycle.examPlan,...(v.cycle?.examPlan||{}),completed:{...base.cycle.examPlan.completed,...(v.cycle?.examPlan?.completed||{})}}},currentExam:v.currentExam?.key?v.currentExam:null,settings:{...base.settings,...(v.settings||{})}};
    }
    let bankContentChanged=false;
    function clearActiveSessions(value){return {...value,generalSession:null,memorySession:null,currentExam:null,lastResult:null}}
    function loadLocal(){try{let value=mergeState(JSON.parse(localStorage.getItem(STORAGE_KEY)||"null"));if(localStorage.getItem(BANK_CONTENT_KEY)!==BANK_META.sourceSha256){value=clearActiveSessions(value);localStorage.setItem(BANK_CONTENT_KEY,BANK_META.sourceSha256);bankContentChanged=true}return value}catch{return defaultState()}}
    let state=loadLocal(); records=state.progress;

    function normalizeText(value,maxLength=200){return String(value??"").trim().slice(0,maxLength)}
    function normalizeAnswer(value){return String(value??"").normalize("NFKC").toLowerCase().replace(/[^\p{L}\p{N}]/gu,"")}
    function todayKey(){return new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Seoul"}).format(new Date())}
    function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function unique(list){return [...new Set(list)]}
    function el(tag,className,text){const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=text;return n}
    function pct(a,b){return b?Math.round(a/b*100):0}
    function typeName(type){return type==="mc"?"객관식":type==="ox"?"OX":"주관식"}
    function answerText(q){
      if(q.type==="mc")return q.answers.map(i=>q.choices[i]).join(" / ");
      if(q.type==="ox")return q.answer;
      return q.answers.join(" / ");
    }
    function progressOf(id){return state.progress[id]||{attempts:0,correct:0,wrong:0,lastResult:null,lastAt:0,lastAnswer:null,lastWrongAt:0}}

    function renderBank(app){
      app.append(el("h2","","전체 문제은행"));const tool=el("div","toolbar"),search=el("input");search.placeholder="문제번호 또는 내용 검색";search.value=bankUi.query;const type=el("select");type.innerHTML='<option value="all">전체 유형</option><option value="mc">객관식</option><option value="ox">OX</option><option value="short">주관식</option>';type.value=bankUi.type;const cat=el("select");cat.innerHTML='<option value="all">전체 구분</option><option value="general">일반</option><option value="afccs">AFCCS</option>';cat.value=bankUi.category;tool.append(search,type,cat);app.append(tool);
      const refresh=()=>{bankUi={...bankUi,query:search.value,type:type.value,category:cat.value,limit:30};renderAll()};search.onchange=refresh;type.onchange=refresh;cat.onchange=refresh;
      const qn=normalizeText(bankUi.query,100).toLowerCase(),list=QUESTIONS.filter(q=>(bankUi.type==="all"||q.type===bankUi.type)&&(bankUi.category==="all"||(bankUi.category==="afccs"?q.afccs:!q.afccs))&&(!qn||String(q.number)===qn||q.prompt.toLowerCase().includes(qn)));
      app.append(el("div","muted",`${list.length}문항`));const wrap=el("div","list section-gap");list.slice(0,bankUi.limit).forEach(q=>{const item=el("details","list-item"),sum=el("summary","",`${q.afccs?"AFCCS ":""}${typeName(q.type)} ${q.number}번 · ${q.prompt.slice(0,70)}${q.prompt.length>70?"…":""}`),body=el("div");const p=progressOf(q.id);body.append(el("p","",q.prompt),el("div","muted",`학습 ${p.attempts}회 · 정답률 ${pct(p.correct,p.attempts)}%`),el("div","answer-box",`정답: ${answerText(q)}`));item.append(sum,body);wrap.append(item)});app.append(wrap);if(list.length>bankUi.limit)app.append(makeButton("더 보기","block",()=>{bankUi.limit+=30;renderAll()}));
    }
    function renderStats(app){
      app.append(el("h2","","학습 통계"));const grid=el("div","grid stats"),ps=Object.values(state.progress),a=ps.reduce((s,p)=>s+p.attempts,0),c=ps.reduce((s,p)=>s+p.correct,0);grid.append(statCard("전체 학습 누적",`${state.cycle.completed}회`),statCard("누적 풀이",`${a}문항`),statCard("누적 정답률",`${pct(c,a)}%`),statCard("즐겨찾기",Object.values(state.favorites).filter(Boolean).length));app.append(grid);
      const by=card("유형별 누적");for(const type of ["mc","ox","short"]){const ids=QUESTIONS.filter(q=>q.type===type),pa=ids.reduce((s,q)=>s+progressOf(q.id).attempts,0),pc=ids.reduce((s,q)=>s+progressOf(q.id).correct,0),row=el("div","result-row");row.append(el("span","",typeName(type)),el("b","",`${pc}/${pa} · ${pct(pc,pa)}%`));by.append(row)}app.append(by,makeButton("뒤로","block",()=>setView("more")));
    }
    async function resetAll(){const typed=prompt("모든 학습기록을 삭제하려면 '전체 초기화'를 입력하세요.");if(typed!=="전체 초기화")return;state=defaultState();records=state.progress;localStorage.removeItem(STORAGE_KEY);if(firebaseReady&&firebaseRemove){try{await firebaseRemove(dataRef)}catch{updateSyncStatus("error")}}currentView="home";renderAll()}
    function renderSettings(app){
      app.append(el("h2","","설정"));const c=card("화면 모드"),chips=el("div","chips");[["system","시스템"],["light","라이트"],["dark","다크"]].forEach(([v,t])=>{const b=makeButton(t,`chip ${state.settings.theme===v?"active":""}`,()=>{state.settings.theme=v;commit()});chips.append(b)});c.append(chips);app.append(c);
      const info=card("데이터");info.append(el("p","",`문제은행 305문항 · 원본 해시 ${BANK_META.sourceSha256.slice(0,12)}…`),el("p","muted","로그인 없이 하나의 공용 학습기록을 사용합니다."),makeButton("전체 초기화","danger block",resetAll));app.append(info,makeButton("뒤로","block",()=>setView("more")));
    }

    document.getElementById("themeBtn").addEventListener("click",cycleTheme);
    window.addEventListener("online",()=>{updateSyncStatus("connecting");connectFirebase()});window.addEventListener("offline",()=>updateSyncStatus("offline"));

        database=getDatabase(initializeApp(firebaseConfig));dataRef=ref(database,DB_PATH);firebaseSet=set;firebaseRemove=remove;
        onValue(dataRef,snapshot=>{const remote=snapshot.exists()?snapshot.val():null,needsContentMigration=bankContentChanged,wasReady=firebaseReady,remoteNewer=remote&&Number(remote.updatedAt)>Number(state.updatedAt);if(remoteNewer)state=mergeState(remote);if(needsContentMigration){state=clearActiveSessions(state);bankContentChanged=false}records=state.progress;localStorage.setItem(STORAGE_KEY,JSON.stringify(state));firebaseReady=true;connecting=false;updateSyncStatus("online");if((!remote&&state.updatedAt)||needsContentMigration)commit(false);if(!wasReady||remoteNewer||needsContentMigration)renderAll()},()=>{firebaseReady=false;connecting=false;updateSyncStatus("error");renderAll()});
      }catch{firebaseReady=false;connecting=false;updateSyncStatus(navigator.onLine?"offline":"offline");renderAll()}
